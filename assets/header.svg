<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Subha - The universe never explains why.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a1f"/>
      <stop offset="0.55" stop-color="#1a1140"/>
      <stop offset="1" stop-color="#2b1647"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#cdb8ff"/>
      <stop offset="0.5" stop-color="#ffb8da"/>
      <stop offset="1" stop-color="#ffd2b0"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" x2="1">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb8da" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd2b0" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" x2="1">
      <stop offset="0" stop-color="#6f56d9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="r"><rect width="900" height="280" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- drifting glow orbs -->
    <g filter="url(#blur)">
      <circle cx="150" cy="70" r="90" fill="#8b6cff" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0 0;50 25;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="750" cy="60" r="100" fill="#ff8fc4" opacity="0.32">
        <animateTransform attributeName="transform" type="translate" values="0 0;-45 30;0 0" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="240" r="80" fill="#ffc6a5" opacity="0.25">
        <animateTransform attributeName="transform" type="translate" values="0 0;30 -20;0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="150" r="1.6" opacity="0.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="40" r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="35" r="1.5" opacity="0.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="140" r="1.3" opacity="0.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="25" r="1" opacity="0.2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="30" r="1.1" opacity="0.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- layered waves -->
    <path fill="url(#w3)" d="M0,215 q112.5,-34 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" d="M0,228 q112.5,-28 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w2)" d="M0,244 q112.5,-22 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- glass panel -->
    <rect x="235" y="52" width="430" height="128" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="236" y="53" width="428" height="40" rx="23" fill="#ffffff" fill-opacity="0.04"/>

    <text x="450" y="124" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="3" fill="url(#name)" opacity="0">
      Subha
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
    </text>
    <text x="450" y="160" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-style="italic" fill="#d9ccff" opacity="0">
      The universe never explains why.
      <animate attributeName="opacity" from="0" to="0.9" dur="1.6s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
</svg>
