<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#9b7bff" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#ff9ecb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="60" y="11" width="780" height="2" rx="1" fill="url(#line)"/>
  <circle cy="12" r="6" fill="#ffc6a5" filter="url(#glow)">
    <animate attributeName="cx" values="120;780;120" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <circle cy="12" r="2.2" fill="#ffffff">
    <animate attributeName="cx" values="120;780;120" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
</svg>
