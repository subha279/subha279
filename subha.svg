<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246" fill="none" role="img" aria-label="SUBHA279 - cybersecurity, python, linux, terminal-first">
  <title>SUBHA279 - python | linux | terminal</title>

  <defs>
    <!-- Animated Tokyo Night gradient: reflect + translate = seamless infinite sweep -->
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-360 0" to="360 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#bb9af7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1a1b26" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1" fill="#7aa2f7" fill-opacity="0.09"/>
    </pattern>

    <filter id="soft" x="-25%" y="-75%" width="150%" height="250%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="card">
      <rect x="0" y="0" width="900" height="246" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- canvas -->
    <rect width="900" height="246" fill="#1a1b26"/>
    <rect width="900" height="246" fill="url(#dots)"/>
    <ellipse cx="450" cy="134" rx="330" ry="98" fill="url(#halo)"/>

    <!-- twinkling accents -->
    <g fill="#7dcfff">
      <circle cx="148" cy="78" r="1.8" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="762" cy="94" r="1.8" opacity="0.2">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="126" cy="176" r="1.6" opacity="0.2">
        <animate attributeName="opacity" values="0.12;0.6;0.12" dur="4.5s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="788" cy="168" r="1.6" opacity="0.2">
        <animate attributeName="opacity" values="0.12;0.65;0.12" dur="5.5s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- editor tab bar -->
    <rect width="900" height="38" fill="#16161e"/>
    <circle cx="26" cy="19" r="5.5" fill="#f7768e"/>
    <circle cx="46" cy="19" r="5.5" fill="#e0af68"/>
    <circle cx="66" cy="19" r="5.5" fill="#9ece6a"/>
    <text x="96" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b94b8">subha279/README.md</text>
    <rect x="0" y="38" width="900" height="1" fill="#2a2e42"/>

    <!-- prompt -->
    <text x="450" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <tspan fill="#9ece6a">&#10095;</tspan><tspan fill="#8b94b8" dx="9">whoami</tspan>
    </text>

    <!-- wordmark -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
      <text x="450" y="146" fill="url(#brand)" opacity="0.45" filter="url(#soft)">SUBHA279</text>
      <text x="450" y="146" fill="url(#brand)">SUBHA279</text>
    </g>

    <rect x="340" y="166" width="220" height="1.5" fill="url(#rule)"/>

    <!-- subtitle -->
    <text x="450" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a9b1d6" letter-spacing="0.4">cybersecurity&#160;&#183;&#160;python&#160;&#183;&#160;linux&#160;&#183;&#160;terminal-first<tspan fill="#7dcfff" dx="4">&#9612;<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <!-- vim status line -->
    <rect x="0" y="207" width="900" height="1" fill="#2a2e42"/>
    <rect x="0" y="208" width="900" height="38" fill="#16161e"/>
    <text x="24" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#9ece6a">-- INSERT --</text>
    <text x="876" y="232" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b94b8">utf-8&#160;&#160;&#183;&#160;&#160;ln 1, col 1&#160;&#160;&#183;&#160;&#160;100%</text>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="244.5" rx="15.25" fill="none" stroke="#7aa2f7" stroke-opacity="0.30" stroke-width="1.5"/>
</svg>
